<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surf - Versão Web</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        #gameCanvas {
            background: #222;
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin-top: 20px;
            border: 3px solid white;
        }
    </style>
</head>
<body>

    <h1>Subway Surf - Versão Web (Em Construção)</h1>

    <!-- Canvas onde o jogo vai acontecer -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        // Teste inicial (para ver se está funcionando)
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "yellow";
        ctx.font = "28px Arial";
        ctx.fillText("Jogo carregado! 🚀", 250, 200);
    </script>

</body>
</html>
